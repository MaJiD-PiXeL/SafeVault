plugins {
    id 'com.android.application' version '8.13.2'
}

def host = providers.gradleProperty('safevaultHost').orNull
if (!(host ==~ /[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+/)) {
    throw new GradleException('Set -PsafevaultHost to the deployed SafeVault HTTPS hostname.')
}

android {
    namespace 'com.nexora.safevault'
    compileSdk 36

    def signingStore = System.getenv('SAFEVAULT_ANDROID_KEYSTORE')
    if (signingStore) {
        signingConfigs {
            distribution {
                storeFile file(signingStore)
                storePassword System.getenv('SAFEVAULT_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('SAFEVAULT_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('SAFEVAULT_ANDROID_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.distribution } }
    }
    // Never quietly produce a release artifact with no distribution signature.
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.project == project && it.name in ['assembleRelease', 'bundleRelease'] }) {
            if (!signingStore || !System.getenv('SAFEVAULT_ANDROID_STORE_PASSWORD') ||
                !System.getenv('SAFEVAULT_ANDROID_KEY_ALIAS') || !System.getenv('SAFEVAULT_ANDROID_KEY_PASSWORD')) {
                throw new GradleException('Release builds require the SAFEVAULT_ANDROID signing environment variables. Use assembleDebug for a local beta.')
            }
        }
    }

    defaultConfig {
        applicationId 'com.nexora.safevault'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        manifestPlaceholders = [vaultHost: host, vaultUrl: "https://${host}/"]
        def association = groovy.json.JsonOutput.toJson([[
            relation: ['delegate_permission/common.handle_all_urls'],
            target: [namespace: 'web', site: "https://${host}/"],
        ]])
        resValue 'string', 'asset_statements', association.replace('"', '\\"')
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.2'
}

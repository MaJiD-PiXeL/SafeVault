name: Verify SafeVault

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: CLI and Django with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: safevault-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DJANGO_SECRET_KEY: safevault-ci-only-django-key
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: safevault-ci-only
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -v
      - name: Check migrations and test Django
        env:
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          python -B backend/manage.py makemigrations --check --dry-run --settings=config.postgres_test_settings
          python -B backend/manage.py test accounts vault --settings=config.postgres_test_settings -v 2

  windows-security:
    name: Native Windows file-security regressions
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -B backend/manage.py test accounts.test_release_tools --settings=config.test_settings -v 2

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  browser:
    name: Isolated real-browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install isolated browser test runtime
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/browser" playwright@1.65.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test with a disposable local beta database
        env:
          SAFEVAULT_PLAYWRIGHT: ${{ runner.temp }}/browser/node_modules/playwright
        shell: bash
        run: |
          python -u deploy/local-beta.py --port 18031 > "$RUNNER_TEMP/local-beta.log" 2>&1 &
          beta=$!
          trap 'kill "$beta" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://127.0.0.1:18031/api/health/', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Isolated beta did not become ready.')
          PY
          node frontend/tests/browser-smoke.mjs
          node frontend/tests/review-regressions.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SafeVault-browser-smoke
          path: native/extension/dist/verification/*.png
          if-no-files-found: ignore

  compose:
    name: Compose HTTPS and account recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: safevault-ci-smoke
      COMPOSE_FILE: compose.yaml:deploy/compose.ci.yaml
      VAULT_HOST: safevault.localhost
      VAULT_BIND_ADDRESS: 127.0.0.1
      VAULT_FROM_EMAIL: no-reply@safevault.localhost
      VAULT_SMTP_HOST: mailpit
      VAULT_SMTP_PORT: '1025'
      VAULT_SMTP_USERNAME: smoke
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare temporary Compose credentials
        run: |
          install -d -m 0700 deploy/secrets
          for secret in django-key postgres-admin-password database-password smtp-password; do
            openssl rand -hex 32 > "deploy/secrets/$secret"
            chmod 0444 "deploy/secrets/$secret"
          done
          printf 'smoke:%s\n' "$(cat deploy/secrets/smtp-password)" > deploy/secrets/smoke-smtp-auth
          openssl req -new -x509 -newkey rsa:2048 -noenc -days 1 \
            -subj /CN=mailpit -addext subjectAltName=DNS:mailpit \
            -keyout deploy/secrets/smoke-smtp.key -out deploy/secrets/smoke-smtp.crt
          chmod 0444 deploy/secrets/smoke-smtp.{crt,key} deploy/secrets/smoke-smtp-auth
      - name: Build and start the stack
        run: |
          install -d -m 0755 deploy/android
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120
      - name: Verify Caddy TLS, vault endpoints and account recovery
        run: |
          certificate="$RUNNER_TEMP/safevault-root.crt"
          for attempt in {1..10}; do
            if docker compose cp edge:/data/caddy/pki/authorities/local/root.crt "$certificate"; then
              break
            fi
            sleep 1
          done
          test -s "$certificate"
          bash deploy/smoke-compose.sh "$certificate" --recovery
      - name: Verify Android association over HTTPS
        shell: bash
        run: |
          url="https://$VAULT_HOST/.well-known/assetlinks.json"
          request=(curl --silent --show-error --max-time 10 --noproxy '*'
            --resolve "$VAULT_HOST:443:127.0.0.1" --cacert "$RUNNER_TEMP/safevault-root.crt")
          status=$("${request[@]}" --output /dev/null --write-out '%{http_code}' "$url")
          test "$status" = 404

          fingerprint=$(openssl rand -hex 32 | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')
          jq -n --arg fingerprint "$fingerprint" '[{
            relation: ["delegate_permission/common.handle_all_urls"],
            target: {namespace: "android_app", package_name: "com.nexora.safevault", sha256_cert_fingerprints: [$fingerprint]}
          }]' > deploy/android/assetlinks.json
          "${request[@]}" --fail --output "$RUNNER_TEMP/assetlinks.json" \
            --write-out '%{http_code} %{content_type}\n' "$url" | grep -Eq '^200 application/json(;|$)'
          cmp deploy/android/assetlinks.json "$RUNNER_TEMP/assetlinks.json"
      - name: Restore the PostgreSQL backup into a separate database
        shell: bash
        run: |
          umask 077
          archive="$RUNNER_TEMP/safevault-smoke.dump"
          docker compose exec -T db pg_dump --username=safevault --format=custom --dbname=safevault > "$archive"
          docker compose exec -T db createdb --username=postgres --template=template0 --owner=safevault safevault_restore_smoke
          docker compose exec -T db pg_restore --username=safevault --single-transaction \
            --no-owner --no-privileges --dbname=safevault_restore_smoke < "$archive"

          fixture=frontend/tests/fixtures/encryption-v1.json
          entry_id=$(jq -er '.entry.id' "$fixture")
          nonce=$(jq -er '.entry.nonce' "$fixture")
          ciphertext=$(jq -er '.entry.ciphertext' "$fixture")
          restored=$(docker compose exec -T db psql --no-psqlrc --username=safevault \
            --dbname=safevault_restore_smoke --quiet --tuples-only --no-align --set=ON_ERROR_STOP=1 \
            --set=entry_id="$entry_id" --set=nonce="$nonce" --set=ciphertext="$ciphertext" <<'SQL'
          SELECT EXISTS (
              SELECT 1 FROM vault_vaultentry AS entry
              JOIN vault_vault AS vault ON vault.id = entry.vault_id
              JOIN auth_user AS owner ON owner.id = vault.owner_id
              JOIN accounts_recoveryemail AS recovery ON recovery.user_id = owner.id
              WHERE owner.username = 'composesmoke' AND recovery.verified_at IS NOT NULL
                AND entry.id = :'entry_id' AND entry.nonce = :'nonce'
                AND entry.ciphertext = :'ciphertext' AND entry.revision = 1
          );
          SQL
          )
          test "$restored" = t
      - name: Collect diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 80
      - name: Remove the test stack and database
        if: always()
        run: docker compose down --volumes
